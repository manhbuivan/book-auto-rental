<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Success - Book Auto Rental</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      .success-page {
        min-height: 100vh;
        padding: 2rem 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
      }
      .result-popup {
        background: linear-gradient(180deg, #161616 0%, #0d0d0d 100%);
        width: 100%;
        max-width: 560px;
        border-radius: 24px;
        padding: 2.5rem 2rem;
        text-align: left;
        border: 1px solid rgba(255, 255, 255, 0.06);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      .result-popup .head {
        text-align: center;
        margin-bottom: 1.75rem;
      }
      .result-popup .icon-wrap {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        background: linear-gradient(
          145deg,
          rgba(34, 197, 94, 0.25) 0%,
          rgba(34, 197, 94, 0.08) 100%
        );
        color: #22c55e;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.25rem;
        font-size: 2.25rem;
        box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.15);
      }
      .result-popup h2 {
        font-size: 1.65rem;
        font-weight: 700;
        margin-bottom: 0.35rem;
        letter-spacing: -0.02em;
      }
      .result-popup .message {
        color: #9ca3af;
        font-size: 0.95rem;
        line-height: 1.5;
        margin: 0;
      }
      .booking-detail-card {
        background: rgba(34, 34, 34, 0.8);
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 1.5rem 1.5rem;
        margin-bottom: 1.5rem;
      }
      .booking-detail-card h4 {
        font-size: 0.7rem;
        color: #6b7280;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin: 0 0 1rem 0;
        font-weight: 600;
      }
      .booking-detail-card .row-item {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1rem;
        padding: 0.6rem 0;
        color: #d1d5db;
        font-size: 0.9rem;
        line-height: 1.4;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      }
      .booking-detail-card .row-item:last-child {
        border-bottom: none;
      }
      .booking-detail-card .row-item strong {
        color: #f3f4f6;
        font-weight: 500;
        flex-shrink: 0;
        min-width: 120px;
      }
      .booking-detail-card .row-item span {
        text-align: right;
        word-break: break-word;
      }
      .booking-detail-card .total-row {
        margin-top: 0.75rem;
        padding-top: 1rem;
        border-top: 1px solid rgba(245, 183, 84, 0.25) !important;
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--main-color, #f5b754);
      }
      .booking-detail-card .total-row span {
        color: var(--main-color, #f5b754);
      }
      .detail-loading {
        text-align: center;
        color: #9ca3af;
        padding: 1.75rem;
        font-size: 0.95rem;
      }
      .detail-loading::before {
        content: "";
        display: inline-block;
        width: 24px;
        height: 24px;
        border: 2px solid rgba(245, 183, 84, 0.3);
        border-top-color: var(--main-color, #f5b754);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        vertical-align: middle;
        margin-right: 10px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .detail-error {
        text-align: center;
        color: #f87171;
        padding: 1.25rem;
        font-size: 0.9rem;
        background: rgba(239, 68, 68, 0.08);
        border-radius: 12px;
        margin-bottom: 1rem;
      }
      .result-popup .actions {
        text-align: center;
        margin-top: 1.75rem;
      }
      .result-popup .btn-main {
        min-width: 200px;
        justify-content: center;
        padding: 1rem 2rem;
      }

      @media (max-width: 576px) {
        .success-page {
          padding: 1rem 0.75rem;
          align-items: flex-start;
          padding-top: 2rem;
        }
        .result-popup {
          padding: 1.75rem 1.25rem;
          border-radius: 20px;
        }
        .result-popup .icon-wrap {
          width: 72px;
          height: 72px;
          font-size: 1.85rem;
          margin-bottom: 1rem;
        }
        .result-popup h2 {
          font-size: 1.35rem;
        }
        .result-popup .message {
          font-size: 0.9rem;
        }
        .booking-detail-card {
          padding: 1.25rem 1rem;
          border-radius: 14px;
        }
        .booking-detail-card .row-item {
          flex-direction: column;
          gap: 0.25rem;
          padding: 0.75rem 0;
        }
        .booking-detail-card .row-item strong {
          min-width: 0;
        }
        .booking-detail-card .row-item span {
          text-align: left;
        }
        .booking-detail-card .total-row {
          font-size: 1.1rem;
        }
        .result-popup .btn-main {
          width: 100%;
          min-width: 0;
          max-width: 280px;
        }
      }
    </style>
  </head>
  <body class="bg-dark text-light">
    <div class="success-page">
      <div class="result-popup rounded-4 shadow-lg">
        <div class="head">
          <div class="icon-wrap">
            <i class="fas fa-check"></i>
          </div>
          <h2 class="fw-bold">Payment Successful</h2>
          <p class="message">
            Your booking has been confirmed. Thank you for choosing us.
          </p>
        </div>

        <div
          id="bookingDetail"
          class="booking-detail-card"
          style="display: none"
        >
          <h4>Booking detail</h4>
          <div id="detailContent"></div>
        </div>
        <div id="detailLoading" class="detail-loading" style="display: none">
          Loading...
        </div>
        <div id="detailError" class="detail-error" style="display: none"></div>

        <div class="actions">
          <a href="index.html" class="btn-main">Back to Booking</a>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const bookingId = params.get("booking_id") || params.get("id");
        if (!bookingId) return;

        const detailEl = document.getElementById("bookingDetail");
        const contentEl = document.getElementById("detailContent");
        const loadingEl = document.getElementById("detailLoading");
        const errorEl = document.getElementById("detailError");

        loadingEl.style.display = "block";

        fetch("https://machshuttle.hayho.org/api/bookings/detail/" + bookingId)
          .then(function (res) {
            return res.json();
          })
          .then(function (data) {
            loadingEl.style.display = "none";
            if (!data.success || !data.data) {
              errorEl.textContent =
                data.message || "Could not load booking detail.";
              errorEl.style.display = "block";
              return;
            }
            const d = data.data;
            function row(label, value) {
              if (value == null || value === "") return "";
              return (
                '<div class="row-item"><strong>' +
                label +
                "</strong><span>" +
                value +
                "</span></div>"
              );
            }
            function formatDate(str) {
              if (!str) return "";
              var date = new Date(str);
              var mm = String(date.getMonth() + 1).padStart(2, "0");
              var dd = String(date.getDate()).padStart(2, "0");
              var yyyy = date.getFullYear();
              var h = date.getHours();
              var m = String(date.getMinutes()).padStart(2, "0");
              var ampm = h >= 12 ? "PM" : "AM";
              var h12 = h % 12 || 12;
              return (
                mm + "/" + dd + "/" + yyyy + ", " + h12 + ":" + m + " " + ampm
              );
            }
            var html = "";
            html += row("Booking ID", d.id || d.bookingId || bookingId);
            html += row(
              "Customer",
              d.customerName ||
                d.fullName ||
                (d.firstName && d.lastName
                  ? d.firstName + " " + d.lastName
                  : "")
            );
            html += row("Phone", d.phone);
            html += row("Email", d.email);
            html += row("Pick up", d.pickupLocation || d.pickup);
            html += row("Drop off", d.dropoffLocation || d.dropoff);
            if (d.dropoffPoints && d.dropoffPoints.length) {
              html += row(
                "Drop off",
                d.dropoffPoints
                  .map(function (p) {
                    return p.location || p.address;
                  })
                  .join(" – ")
              );
            }
            html += row(
              "Date of Service",
              d.pickupDateTime
                ? formatDate(d.pickupDateTime)
                : d.pickupDate && d.pickupTime
                ? d.pickupDate + " " + d.pickupTime
                : ""
            );
            if (d.returnPickupDateTime) {
              html += row("Return", formatDate(d.returnPickupDateTime));
            }
            html += row("Vehicle", d.carName || d.vehicleName);
            if (d.totalPrice != null) {
              var total =
                typeof d.totalPrice === "number"
                  ? "$" + d.totalPrice.toLocaleString()
                  : d.totalPrice;
              html +=
                '<div class="row-item total-row"><strong>Total</strong><span>' +
                total +
                "</span></div>";
            }
            contentEl.innerHTML =
              html || "<p class='text-muted'>No details</p>";
            detailEl.style.display = "block";
          })
          .catch(function (err) {
            loadingEl.style.display = "none";
            errorEl.textContent = "Could not load booking detail.";
            errorEl.style.display = "block";
          });
      })();
    </script>
  </body>
</html>
