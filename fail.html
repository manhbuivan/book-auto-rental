<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Failed - Book Auto Rental</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      .fail-page {
        min-height: 100vh;
        padding: 2rem 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
      }
      .result-popup {
        background: linear-gradient(180deg, #161616 0%, #0d0d0d 100%);
        width: 100%;
        max-width: 440px;
        border-radius: 24px;
        padding: 2.5rem 2rem;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.06);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      .result-popup .icon-wrap {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        background: linear-gradient(
          145deg,
          rgba(239, 68, 68, 0.25) 0%,
          rgba(239, 68, 68, 0.08) 100%
        );
        color: #ef4444;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.25rem;
        font-size: 2.25rem;
        box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.15);
      }
      .result-popup h2 {
        font-size: 1.65rem;
        font-weight: 700;
        margin-bottom: 0.35rem;
        letter-spacing: -0.02em;
      }
      .result-popup .message {
        color: #9ca3af;
        font-size: 0.95rem;
        line-height: 1.5;
        margin: 0 0 1.75rem 0;
      }
      .result-popup .btn-main {
        min-width: 200px;
        justify-content: center;
        padding: 1rem 2rem;
      }
      @media (max-width: 576px) {
        .fail-page {
          padding: 1rem 0.75rem;
          align-items: flex-start;
          padding-top: 2rem;
        }
        .result-popup {
          padding: 1.75rem 1.25rem;
          border-radius: 20px;
        }
        .result-popup .icon-wrap {
          width: 72px;
          height: 72px;
          font-size: 1.85rem;
          margin-bottom: 1rem;
        }
        .result-popup h2 {
          font-size: 1.35rem;
        }
        .result-popup .message {
          font-size: 0.9rem;
        }
        .result-popup .btn-main {
          width: 100%;
          min-width: 0;
          max-width: 280px;
        }
      }
    </style>
  </head>
  <body class="bg-dark text-light">
    <div class="fail-page">
      <div class="result-popup rounded-4 shadow-lg">
        <div class="icon-wrap">
          <i class="fas fa-times"></i>
        </div>
        <h2 class="fw-bold">Payment Failed</h2>
        <p class="message">
          Your payment could not be completed. Please try again or choose
          another payment method.
        </p>
        <a href="index.html" class="btn-main">Try Again</a>
      </div>
    </div>
  </body>
</html>
