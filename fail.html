<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Failed - Book Auto Rental</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      .result-popup {
        background: #111;
        width: 520px;
        max-width: 95%;
        border-radius: 20px;
        padding: 3rem;
        text-align: center;
      }
      .result-popup .icon-wrap {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: rgba(239, 68, 68, 0.2);
        color: #ef4444;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        font-size: 2.5rem;
      }
      .result-popup h2 {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }
      .result-popup .message {
        color: #aaa;
        margin-bottom: 2rem;
      }
      .result-popup .btn-main {
        min-width: 200px;
        justify-content: center;
      }
    </style>
  </head>
  <body class="bg-dark d-flex align-items-center justify-content-center vh-100">
    <div class="result-popup rounded-4 shadow-lg text-light">
      <div class="icon-wrap">
        <i class="fas fa-times"></i>
      </div>
      <h2 class="fw-bold">Payment Failed</h2>
      <p class="message">
        Your payment could not be completed. Please try again or choose another
        payment method.
      </p>
      <a href="index.html" class="btn-main">Try Again</a>
    </div>
  </body>
</html>
